<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IOC Lookup</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  
  <style>
    /* Larger responsive sizing for service icons */
    @media (max-width: 640px) {
      .icon-virus-total {
        width: 120px !important;
        height: 24px !important;
      }
      
      .logo {
        height: 20px !important;
      }
      
      h1 .h-6, h1 .h-7, h1 .h-8 {
        height: 20px !important;
        width: 20px !important;
      }
    }

    @media (min-width: 641px) and (max-width: 768px) {
      .icon-virus-total {
        width: 160px !important;
        height: 32px !important;
      }
    }

    @media (min-width: 769px) {
      .icon-virus-total {
        width: 180px !important;
        height: 36px !important;
      }
    }
  </style>
</head>
<body class="min-h-screen p-2 sm:p-4 lg:p-6 bg-[#1e1e1e] text-white font-sans transition-all duration-300">
  
<div class="max-w-7xl mx-auto bg-[#2a2a2a] p-4 sm:p-6 lg:p-10 rounded-2xl shadow-lg space-y-6 sm:space-y-10 light-panel neon-border">

  <!-- Header -->
  <div class="sticky top-0 z-50 shadow-lg">
    <div class="bg-red-600 text-white px-3 sm:px-6 py-3 sm:py-4 rounded-t-2xl flex flex-col sm:flex-row items-center justify-between gap-3">
      <!-- Title with responsive wrapping and justified spacing -->
      <h1 class="text-sm sm:text-lg md:text-xl lg:text-2xl font-semibold flex flex-wrap items-center justify-between sm:justify-start gap-3 sm:gap-4 md:gap-6 lg:gap-8 w-full sm:w-auto">
        <span class="whitespace-nowrap text-base sm:text-lg md:text-xl lg:text-2xl">IOC Lookup (IP/URL/FILE HASH) | Backup Node</span>
        
        <!-- VirusTotal icon - Larger -->
        <div class="icon-virus-total" title="VirusTotal" style="width: 160px; height: 32px; color: rgb(40, 3, 255);">
          <svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 564.3 109" fill="currentColor">
            <path d="m158.6 78.7-17.1-48.6h8.9c10.5 30.5 11.9 34.8 13 38.6 1-3.5 2.6-8.2 13.5-38.6h8.9l-17.9 48.6h-9.3zM194.2 78.7V30.2h8.3v48.5zM299.6 58.3c0 6.6-.6 10.8-2.4 13.9-2.8 4.9-8.7 7.6-17.3 7.6-8.1 0-14.1-2.4-16.9-7.8-1.7-3.1-2.3-7.7-2.3-13.2V30.2h8.3v28.4c0 4 .3 6.8 1 8.6 1.2 3.1 4.2 5.5 10.3 5.5 5.3 0 8.5-1.8 10.1-5.1.8-1.7 1.6-4.9 1.6-8.9V30.2h7.6v28.1zM310.1 69.4c3.7 1.7 8.5 3.3 14.1 3.3 6.6 0 10-2.4 10-6.7 0-3.3-1.2-5.1-7.6-7.3l-6.8-2.3c-7.1-2.4-10.4-6.6-10.4-13.5 0-7.4 5.8-13.9 18.3-13.9 4.9 0 9.7.8 13.6 2.2l-1.8 6.9c-4-1.3-8.8-2.2-12.8-2.2-6.7 0-8.6 3.5-8.6 6.4 0 2.9.9 4.9 6.5 6.7l6.8 2.4c8.3 2.8 11.2 7.2 11.2 13.5 0 7.7-5.3 14.6-18.4 14.6-6.1 0-12-1.4-16.2-3.4l2.1-6.7zM365.5 78.7V37.8H351v-7.6h37.4v7.6h-14.5v40.9zM452.2 78.7V37.8h-14.5v-7.6h37.4v7.6h-14.5v40.9zM412 79.7c-14.1 0-23-11.8-23-25.8 0-15.4 9-24.8 24.2-24.8 14.6 0 22.2 11.3 22.3 24.8.1 13.9-8.7 25.8-23.5 25.8zm.6-43.6c-9.6 0-14.8 6-14.8 17.9 0 14.5 6.3 18.7 14.6 18.7 8.6 0 14.4-5.3 14.4-18.3.2-11.5-3.1-18.3-14.2-18.3zM473.4 78.7l18.7-48.6h9.6l18.2 48.6H511L506.1 66h-18.9l-5 12.8h-8.8zm30.5-19.8c-4.5-12.5-6-16.5-7-19.9-1.1 3.3-2.4 7.1-7.4 19.9h14.4zM527.9 78.7V30.2h9v41.2l24.2-.3.1 7.6zM0 5.9l48.7 48.6L0 103h107.5V5.9H0zm97.1 86.7H24.5l38.4-38.1-38.4-38.2h72.6v76.3zM240.8 57.7c7.2-2.4 10-7.5 10-13.7 0-6.7-3.5-10.9-8.6-12.5-3-.9-7.3-1.3-11.5-1.3h-15v48.6h8.3V58.9l2.8-.2c3.7 0 5.5.4 6.3.3L244 78.7h9.2l-12.4-21zm-2.2-6.6c-2 1.1-4.9 1.4-8.4 1.4H224V37.1h6.3c3.3 0 5.8.1 7.7.8 2.6 1 4 3.3 4 6.6-.1 3-1.2 5.4-3.4 6.6z" class="st0"></path>
          </svg>
        </div>
        
        <!-- AbuseIPDB - Larger -->
        <span class="flex items-center gap-2 whitespace-nowrap text-sm sm:text-base md:text-lg">
          <img src="https://www.abuseipdb.com/img/abuseipdb-logo.svg" alt="AbuseIPDB" class="logo" style="height:24px;"/>
          <span>AbuseIPDB</span>
        </span>
        
        <!-- IPVoid - Larger -->
        <span class="flex items-center gap-2 whitespace-nowrap text-sm sm:text-base md:text-lg">
          <img src="https://www.ipvoid.com/favicon.ico" alt="IPVoid" title="IPVoid" class="h-6 w-6 sm:h-7 sm:w-7 lg:h-8 lg:w-8" />
          <span>Void</span>
        </span>
        
        <!-- URLVoid - Larger -->
        <span class="flex items-center gap-2 whitespace-nowrap text-sm sm:text-base md:text-lg">
          <i class="fa fa-search text-lg sm:text-xl" title="URLVoid" style="color:#FFC312;" aria-hidden="true"></i>
          <span class="font-bold">URL<span class="text-orange">Void</span></span>
        </span>
      </h1>
      
      <!-- Theme toggle -->
      <button id="toggleTheme" class="text-white text-lg sm:text-xl hover:text-yellow-300 transition duration-300 flex-shrink-0">
        <i class="ph ph-moon-stars"></i>
      </button>
    </div>
  </div>
  

  <!-- Input + Message -->
  <div id="mainInputArea" class="flex flex-col lg:flex-row gap-6 lg:gap-10 items-start justify-center min-h-[30vh] sm:min-h-[40vh]">

    <!-- Input Section -->
    <div class="w-full lg:w-1/2">
      <!-- Textarea -->
      <textarea id="ipInput" autocomplete="off" rows="6" class="w-full p-3 sm:p-4 text-sm sm:text-base lg:text-lg rounded-lg border-2 border-green-400 bg-[#1e1e1e] text-white placeholder-gray-400 mt-4 sm:mt-6 focus:outline-none focus:ring-2 focus:ring-green-300"
          placeholder="Enter IPs, URLs, or HASHES (comma, space, or newline separated)..."></textarea>

      <!-- Buttons with original neon-button style -->
      <div class="flex flex-wrap sm:flex-nowrap gap-3 justify-start mt-4">
        <button id="lookupButton" onclick="fetchIPData()" class="neon-button flex items-center gap-2 text-sm sm:text-lg icon-btn">
          <i class="ph ph-arrow-right"></i>
          <span class="btn-label">Get Info</span>
        </button>
        <div id="resetContainer" class="hidden">
          <button id="resetBtn" type="button" class="neon-button icon-btn" onclick="resetTool()">
            <i class="ph ph-arrow-counter-clockwise"></i>
            <span class="btn-label">Reset</span>
          </button>
        </div>
      </div>

      <p id="errorMsg" class="text-red-400 text-left mt-2 hidden font-semibold text-xs sm:text-sm lg:text-base">⚠️ Please enter at least one valid IP, URL, or HASH.</p>

      <div id="spinner" class="mt-4 hidden flex justify-start">
        <div class="spinner"></div>
      </div>
    </div>

    <!-- Message Block -->
    <div class="w-full lg:w-1/2">
      <div id="messageBlock" class="hidden border border-yellow-400 rounded-xl p-4 sm:p-6 bg-[#1e1e1e] w-full mt-4 sm:mt-6">
        <div class="section-title border-2 border-yellow-400 px-3 sm:px-4 py-1 inline-block rounded-full mb-4 text-sm sm:text-base lg:text-xl font-semibold text-center">
          Request Summary
        </div>
        <div id="message" class="rounded-xl border border-gray-700 text-left text-xs sm:text-sm lg:text-base leading-relaxed font-mono max-h-64 sm:max-h-96 overflow-y-auto custom-scroll text-yellow-300 p-2 sm:p-3"></div>
      </div>
    </div>
  </div>

  <!-- Summary + Table -->
  <div class="flex flex-col lg:flex-row gap-6 lg:gap-10">

    <!-- Summary Section -->
    <div id="summarySection" class="w-full lg:w-1/2 hidden border border-yellow-400 rounded-xl p-4 sm:p-6 bg-[#1e1e1e]">
      <div class="section-title border-2 border-yellow-400 px-3 sm:px-4 py-1 inline-block rounded-full mb-4 text-sm sm:text-base lg:text-xl font-semibold text-center">
        Summary
      </div>
      <div id="summary" class="whitespace-pre-wrap p-3 sm:p-4 rounded-xl border border-gray-700 text-left text-xs sm:text-sm lg:text-base leading-relaxed font-mono max-h-64 sm:max-h-96 overflow-y-auto custom-scroll"></div>
      <div class="flex flex-wrap gap-3 justify-start mt-4">
        <button id="copySummaryBtn" onclick="copyToClipboard('summary', 'copySummaryBtn')" class="neon-button flex items-center gap-2 text-sm icon-btn">
          <i class="ph ph-copy"></i>
          <span class="btn-label">Copy Summary</span>
        </button>
      </div>
    </div>

    <!-- Table Section -->
    <div id="tableSection" class="w-full lg:w-1/2 hidden border border-yellow-400 rounded-xl p-4 sm:p-6 bg-[#1e1e1e]">
      <div class="section-title border-2 border-yellow-400 px-3 sm:px-4 py-1 inline-block rounded-full mb-4 text-sm sm:text-base lg:text-xl font-semibold text-center">
        Table
      </div>
      <div class="overflow-x-auto custom-scroll">
        <div class="max-h-64 sm:max-h-96 overflow-y-auto custom-scroll">
          <table class="min-w-full table-auto border border-collapse text-white text-xs sm:text-sm">
            <thead id="tableHead" class="sticky top-0 bg-[#2a2a2a] z-20"></thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div>

      <div class="flex flex-wrap gap-3 justify-start mt-4">
        <button id="copyTableBtn" onclick="copyTableToClipboard('copyTableBtn')" class="neon-button flex items-center gap-2 text-sm icon-btn">
          <i class="ph ph-copy"></i>
          <span class="btn-label">Copy Table</span>
        </button>
        <button id="downloadExcelBtn" onclick="downloadExcel()" class="neon-button flex items-center gap-2 text-sm icon-btn" style="display:none;">
          <i class="ph ph-download-simple"></i>
          <span class="btn-label">Export to Excel</span>
        </button>
      </div>
    </div>
  </div>
  
  <!-- Footer - Inside main container -->
  <footer class="custom-footer">
    <div class="footer-bar">
      <div class="footer-links">
        <a href="/about" class="footer-icon-link" title="About">
          <i class="fas fa-circle-info"></i>
        </a>
        <a href="https://mail.google.com/mail/?view=cm&fs=1&to=hrajofficial01@gmail.com" class="footer-icon-link" target="_blank" title="Email">
          <i class="fas fa-envelope"></i>
        </a>
      </div>

      <div class="footer-divider"></div>

      <div class="footer-copy">
        &copy; <span id="current-year"></span> IOC Lookup Tool. All rights reserved.
      </div>
    </div>
  </footer>

</div>
<!-- End of main container -->

<script>
  document.getElementById('current-year').textContent = new Date().getFullYear();
</script>

<script src="https://cdn.jsdelivr.net/npm/ipaddr.js@latest/ipaddr.min.js"></script>
<script src="{{ url_for('static', filename='JS/script.js') }}"></script>

</body>
</html>
