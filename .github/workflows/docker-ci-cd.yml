name: Docker CI/CD Pipeline

on:
  push:
    branches:
      - main_gcp_integration
  workflow_dispatch:      # Allows manual run from Actions tab
  
jobs:
  build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Write GCP Service Account Key
        run: |
          mkdir -p ./secrets
          echo "${{ secrets.GCP_SA_KEY }}" > ./secrets/credentials.json
          chmod 600 ./secrets/credentials.json

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/ip-lookup-tool:latest
          file: ./Dockerfile
          platforms: linux/amd64

      - name: Run Docker Hub image cleaner
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_REPO: ${{ secrets.DOCKER_REPO }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: python delete_old_images.py || echo "Image cleaner failed, continuing..."

      - name: Clean up secret file
        if: always()
        run: rm -rf ./secrets

      - name: Trigger deployment webhook
        if: success()
        run: curl -X POST https://yourserver.com/deploy-webhook
