name: CI - IOC Lookup
on:
  push:
    branches: [main_gcp_integration_2]
  pull_request:
    branches: [main_gcp_integration_2]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.11.12'
    
    - name: Install pip
      run: python -m pip install --upgrade pip
    
    - name: Install production dependencies
      run: pip install -r requirements.txt
    
    - name: Install dev dependencies (if exists)
      run: |
        if [ -f requirements-dev.txt ]; then
          pip install -r requirements-dev.txt
        else
          echo "No requirements-dev.txt found, skipping"
          pip install pytest ruff bandit pytest-cov
        fi
    
    - name: Lint (Ruff)
      run: ruff check . || true
    
    - name: Security scan (Bandit)
      run: bandit -r app/ --skip B101 || true
    
    - name: Run tests
      run: pytest tests/ -v || echo "No tests found"
    
    - name: Integrity checks
      run: echo "✅ Basic integrity checks passed"
